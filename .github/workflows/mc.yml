name: Set up Horizon (Minecraft 26.3 in Rust)

# Put this file at .github/workflows/horizon-setup.yml
# Runs on Linux and Windows runners (matrix). Horizon contains no game files, so
# each job rebuilds the "played once from the official launcher" state itself:
# it downloads the Minecraft 26.3 client jar, libraries, assets and server jar
# from Mojang's public endpoints, then runs horizon-prepare. The prepared output
# is derived from the game, so it is deliberately NOT uploaded or cached publicly.

on:
  workflow_dispatch:
    inputs:
      mc_version:
        description: Minecraft version Horizon targets
        default: "26.3"
      asset_pattern:
        description: Override the glob for the Horizon release archive (empty = per-OS default)
        default: ""
      with_sounds:
        description: Also prepare sounds
        type: boolean
        default: true
      run_server:
        description: Init + start a Horizon server and print its status
        type: boolean
        default: false
      publish:
        description: Package the prepared Horizon folder and attach it to a GitHub Release
        type: boolean
        default: true
      release_tag:
        description: Release tag (empty = horizon-<mc version>-run<run number>)
        default: ""
      draft:
        description: Create the release as a draft (recommended, see note on redistribution)
        type: boolean
        default: true

# NOTE: the prepared output is derived from Mojang's game files. Only publish it
# in a PRIVATE repo (or keep it as a draft). Publishing it from a public repo
# redistributes Minecraft content, which Horizon's own docs say not to do.

concurrency:
  group: horizon-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write   # needed to create releases and upload assets

jobs:
  horizon:
    name: Horizon on ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            runner: ubuntu-latest
            mc_os: linux
            exe: ""
            pattern: "*linux*x86*64*"
          - name: Windows
            runner: windows-latest
            mc_os: windows
            exe: ".exe"
            pattern: "*windows*"
    defaults:
      run:
        shell: bash
    env:
      MC_VERSION: ${{ inputs.mc_version || '26.3' }}
      MC_OS: ${{ matrix.mc_os }}
      EXE: ${{ matrix.exe }}
      ASSET_PATTERN: ${{ inputs.asset_pattern || matrix.pattern }}
      MC_DIR: ${{ github.workspace }}/mc-home/.minecraft
      HORIZON_MINECRAFT_DIR: ${{ github.workspace }}/mc-home/.minecraft
      HORIZON_DIR: ${{ github.workspace }}/horizon
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}   # no checkout step, so tell gh which repo to use

    steps:
      - name: Install Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install runtime libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libasound2t64 libudev1 || \
          sudo apt-get install -y --no-install-recommends libasound2 libudev1

      - name: Download Horizon (latest non-launcher release)
        run: |
          set -euo pipefail
          mkdir -p "$HORIZON_DIR" dl
          TAG=$(gh release list --repo horizon-rust/horizon --exclude-drafts --exclude-pre-releases \
                  --limit 50 --json tagName --jq '.[].tagName' | grep -vi 'launcher' | head -n1)
          echo "Horizon release: $TAG"
          gh release download "$TAG" --repo horizon-rust/horizon --pattern "$ASSET_PATTERN" --dir dl
          ls -la dl
          python - <<'PY'
          import os, shutil, glob
          dest = os.environ["HORIZON_DIR"]
          for f in glob.glob("dl/*"):
              if f.endswith((".sha256", ".sig", ".asc")):
                  continue
              try:
                  shutil.unpack_archive(f, dest)
              except shutil.ReadError:
                  shutil.copy(f, dest)
          # Flatten if everything is nested in one folder.
          exe = ".exe" if os.name == "nt" else ""
          if not os.path.exists(os.path.join(dest, "horizon-prepare" + exe)):
              for root, _, files in os.walk(dest):
                  if "horizon-prepare" + exe in files:
                      for name in os.listdir(root):
                          shutil.move(os.path.join(root, name), os.path.join(dest, name))
                      break
          PY
          chmod +x "$HORIZON_DIR"/horizon-* 2>/dev/null || true
          echo "--- all assets in $TAG ---"
          gh release view "$TAG" --repo horizon-rust/horizon --json assets --jq '.assets[].name'
          echo "--- downloaded ---"
          ls -la dl
          echo "--- extracted tree ---"
          find "$HORIZON_DIR" -maxdepth 3 | head -n 80
          if [ -z "$(find "$HORIZON_DIR" -name "horizon-prepare*" -type f | head -n1)" ]; then
            echo "::error::No horizon-prepare in the downloaded archive(s). Set the asset_pattern input to the right file (see the asset list above)."
            exit 1
          fi

      - name: Cache Mojang downloads
        uses: actions/cache@v4
        with:
          path: mc-home/.minecraft
          key: mc-${{ env.MC_VERSION }}-${{ matrix.mc_os }}-v1

      - name: Fetch Minecraft files from Mojang
        run: |
          set -euo pipefail
          cat > fetch_mc.py <<'PY'
          import hashlib, json, os, urllib.request
          from concurrent.futures import ThreadPoolExecutor

          VER = os.environ["MC_VERSION"]
          MC = os.environ["MC_DIR"]
          MC_OS = os.environ["MC_OS"]
          MANIFEST = "https://piston-meta.mojang.com/mc/game/version_manifest_v2.json"

          def get(url):
              req = urllib.request.Request(url, headers={"User-Agent": "horizon-ci"})
              with urllib.request.urlopen(req, timeout=60) as r:
                  return r.read()

          def fetch(url, dest, sha1=None):
              if os.path.exists(dest) and (not sha1 or hashlib.sha1(open(dest, "rb").read()).hexdigest() == sha1):
                  return
              os.makedirs(os.path.dirname(dest), exist_ok=True)
              for attempt in range(4):
                  data = get(url)
                  if not sha1 or hashlib.sha1(data).hexdigest() == sha1:
                      with open(dest, "wb") as f:
                          f.write(data)
                      return
              raise SystemExit(f"checksum mismatch: {url}")

          def allowed(rules):
              if not rules:
                  return True
              ok = False
              for r in rules:
                  if "features" in r:
                      continue
                  os_rule = r.get("os", {})
                  if os_rule.get("name") in (None, MC_OS) and "arch" not in os_rule:
                      ok = r["action"] == "allow"
                  elif os_rule.get("name") == MC_OS and os_rule.get("arch") in ("x86_64", "amd64", "x64"):
                      ok = r["action"] == "allow"
              return ok

          manifest = json.loads(get(MANIFEST))
          entry = next((v for v in manifest["versions"] if v["id"] == VER), None)
          if not entry:
              raise SystemExit(f"Version {VER} not found in Mojang manifest")
          vjson_bytes = get(entry["url"])
          vjson = json.loads(vjson_bytes)

          vdir = os.path.join(MC, "versions", VER)
          os.makedirs(vdir, exist_ok=True)
          with open(os.path.join(vdir, f"{VER}.json"), "wb") as f:
              f.write(vjson_bytes)

          client = vjson["downloads"]["client"]
          fetch(client["url"], os.path.join(vdir, f"{VER}.jar"), client["sha1"])

          server = vjson["downloads"]["server"]
          fetch(server["url"], os.path.join(os.environ["GITHUB_WORKSPACE"], "server.jar"), server["sha1"])

          jobs = []
          for lib in vjson.get("libraries", []):
              if not allowed(lib.get("rules")):
                  continue
              art = lib.get("downloads", {}).get("artifact")
              if art:
                  jobs.append((art["url"], os.path.join(MC, "libraries", art["path"]), art["sha1"]))

          ai = vjson["assetIndex"]
          idx_path = os.path.join(MC, "assets", "indexes", ai["id"] + ".json")
          fetch(ai["url"], idx_path, ai["sha1"])
          for obj in json.load(open(idx_path))["objects"].values():
              h = obj["hash"]
              jobs.append((f"https://resources.download.minecraft.net/{h[:2]}/{h}",
                           os.path.join(MC, "assets", "objects", h[:2], h), h))

          print(f"Downloading {len(jobs)} files...", flush=True)
          with ThreadPoolExecutor(32) as ex:
              list(ex.map(lambda j: fetch(*j), jobs))
          print("Done.")
          PY
          python fetch_mc.py
          ls "$MC_DIR" "$MC_DIR/versions/$MC_VERSION"

      - name: Prepare Horizon
        working-directory: horizon
        run: |
          set -euo pipefail
          java -version
          ./horizon-prepare$EXE --help || true
          touch "$GITHUB_WORKSPACE/prep.marker"; sleep 2
          ./horizon-prepare$EXE --prepare --server-jar "$GITHUB_WORKSPACE/server.jar" --minecraft-dir "$MC_DIR"

      - name: Prepare sounds (optional)
        if: ${{ inputs.with_sounds != false }}
        working-directory: horizon
        run: ./horizon-prepare$EXE sounds --minecraft-dir "$MC_DIR"

      - name: Sanity check
        working-directory: horizon
        run: |
          ./horizon-client$EXE --help | head -n 20
          ./horizon-ctl$EXE help | head -n 20
          ls -la

      - name: Run a Horizon server (optional)
        if: ${{ inputs.run_server }}
        working-directory: horizon
        run: |
          set -euo pipefail
          ./horizon-server$EXE --dir my-server init
          ./horizon-server$EXE --dir my-server start
          sleep 30
          ./horizon-server$EXE --dir my-server status
          ./horizon-server$EXE --dir my-server cmd list
          ./horizon-server$EXE --dir my-server stop

      - name: Package prepared Horizon
        if: ${{ inputs.publish != false }}
        run: |
          set -euo pipefail
          mkdir -p stage/horizon-prepared
          cp -a "$HORIZON_DIR"/. stage/horizon-prepared/

          # Find everything horizon-prepare wrote anywhere (files newer than the
          # marker whose path mentions "horizon") and put it in the bundle under
          # .local/horizon-client/..., the layout the client reads from.
          python - <<'PY'
          import os, shutil, sys
          marker = os.path.getmtime(os.path.join(os.environ["GITHUB_WORKSPACE"], "prep.marker"))
          stage = os.path.join("stage", "horizon-prepared")
          roots = [os.environ.get(k) for k in ("HOME", "USERPROFILE", "LOCALAPPDATA", "APPDATA")]
          roots = [r for r in dict.fromkeys(roots) if r and os.path.isdir(r)]
          skip = (os.path.normpath(os.environ["MC_DIR"]).lower(), os.path.normpath(os.environ["HORIZON_DIR"]).lower())
          copied, origins = 0, set()
          for root in roots:
              for dp, dn, fn in os.walk(root):
                  low = os.path.normpath(dp).lower()
                  if low.startswith(skip) or "hostedtoolcache" in low or "\\temp" in low or "/tmp" in low:
                      dn[:] = []
                      continue
                  parts = os.path.normpath(dp).split(os.sep)
                  if "horizon-client" not in parts:
                      continue
                  i = parts.index("horizon-client")
                  for f in fn:
                      src = os.path.join(dp, f)
                      if os.path.getmtime(src) < marker:
                          continue
                      rel = os.path.join(*parts[i:], f)
                      dst = os.path.join(stage, ".local", rel)
                      os.makedirs(os.path.dirname(dst), exist_ok=True)
                      shutil.copy2(src, dst)
                      copied += 1
                      origins.add(os.sep.join(parts[: i + 1]))
          local = os.path.join(os.environ["HORIZON_DIR"], ".local")
          inplace = sum(len(f) for _, _, f in os.walk(local)) if os.path.isdir(local) else 0
          print(f"prepared files copied from outside the Horizon folder: {copied} (from {sorted(origins)})")
          print(f"prepared files already inside the Horizon folder (.local): {inplace}")
          if copied + inplace < 50:
              print("::error::horizon-prepare output not found - refusing to publish a bundle that would crash on start")
              sys.exit(1)
          with open(os.path.join(stage, "INSTALL.txt"), "w") as f:
              f.write("Unzip anywhere and run horizon-client. Prepared resources are in .local/horizon-client/%s.\n"
                      "If the client cannot find them, pass --resources <this folder>/.local/horizon-client/%s\n"
                      % (os.environ["MC_VERSION"], os.environ["MC_VERSION"]))
          PY

          NAME="horizon-prepared-${MC_VERSION}-${MC_OS}"
          python - <<PY
          import os, shutil
          fmt = "zip" if os.environ["MC_OS"] == "windows" else "gztar"
          print(shutil.make_archive("$NAME", fmt, "stage", "horizon-prepared"))
          PY
          ls -la "$NAME".*
          sha256sum "$NAME".* > "$NAME.sha256"
          echo "ASSET_BASE=$NAME" >> "$GITHUB_ENV"

      - name: Publish to GitHub Release
        if: ${{ inputs.publish != false }}
        run: |
          set -euo pipefail
          TAG="${{ inputs.release_tag }}"
          [ -n "$TAG" ] || TAG="horizon-${MC_VERSION}-run${{ github.run_number }}"
          DRAFT_FLAG=""
          [ "${{ inputs.draft }}" != "false" ] && DRAFT_FLAG="--draft"

          # Both matrix jobs target the same release: whoever gets there first creates it.
          gh release view "$TAG" >/dev/null 2>&1 || \
            gh release create "$TAG" $DRAFT_FLAG \
              --title "Horizon $MC_VERSION prepared build ($TAG)" \
              --notes "Horizon prepared for Minecraft Java $MC_VERSION by CI. Derived from Mojang's game files: do not redistribute." \
              --target "${{ github.sha }}" || sleep 5

          gh release upload "$TAG" "$ASSET_BASE".* --clobber
          echo "Release: $TAG"
